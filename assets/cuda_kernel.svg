<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
  <defs>
    <filter id="shadow" x="-3%" y="-8%" width="106%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="#0f172a"/>

  <!-- Input Image -->
  <text x="480" y="24" text-anchor="middle" font-size="13" fill="#94a3b8" font-family="sans-serif">Input Image</text>

  <line x1="480" y1="32" x2="480" y2="44" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- K1 -->
  <g transform="translate(180, 52)" filter="url(#shadow)">
    <rect width="600" height="48" fill="#162032" stroke="rgba(56,189,248,0.4)" stroke-width="1.5" stroke-dasharray="6,4" rx="10"/>
    <text x="300" y="29" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">1. GenerateOLC</text>
  </g>

  <line x1="480" y1="104" x2="480" y2="116" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- K2 -->
  <g transform="translate(180, 124)" filter="url(#shadow)">
    <rect width="600" height="48" fill="#162032" stroke="rgba(56,189,248,0.4)" stroke-width="1.5" stroke-dasharray="6,4" rx="10"/>
    <text x="300" y="29" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">2. Encode</text>
  </g>

  <line x1="480" y1="176" x2="480" y2="188" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 5 Shares (text only) -->
  <text x="480" y="210" text-anchor="middle" font-size="13" fill="#94a3b8" font-family="sans-serif">5 Shares (distributed to n participants)</text>

  <line x1="480" y1="224" x2="480" y2="236" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- K3 -->
  <g transform="translate(180, 244)" filter="url(#shadow)">
    <rect width="600" height="48" fill="#162032" stroke="rgba(56,189,248,0.4)" stroke-width="1.5" stroke-dasharray="6,4" rx="10"/>
    <text x="300" y="29" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">3. ComposeD</text>
  </g>

  <line x1="480" y1="296" x2="480" y2="308" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- K4 -->
  <g transform="translate(180, 316)" filter="url(#shadow)">
    <rect width="600" height="48" fill="#162032" stroke="rgba(56,189,248,0.4)" stroke-width="1.5" stroke-dasharray="6,4" rx="10"/>
    <text x="300" y="29" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">4. BuildFastDecode</text>
  </g>

  <line x1="480" y1="368" x2="480" y2="380" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- K5 -->
  <g transform="translate(180, 388)" filter="url(#shadow)">
    <rect width="600" height="48" fill="#162032" stroke="rgba(56,189,248,0.4)" stroke-width="1.5" stroke-dasharray="6,4" rx="10"/>
    <text x="300" y="29" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">5. Decode</text>
  </g>

  <line x1="480" y1="440" x2="480" y2="452" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Output Image -->
  <text x="480" y="470" text-anchor="middle" font-size="13" fill="#94a3b8" font-family="sans-serif">Output Image</text>
</svg>
