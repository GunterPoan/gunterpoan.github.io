<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-bot" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-blue" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="800" height="400" fill="none"/>

  <!-- ===================== CONVERSATION AREA (Left/Center) ===================== -->

  <!-- User 1 -->
  <circle cx="60" cy="55" r="20" fill="#475569"/>
  <g transform="translate(60,55) scale(0.45)">
    <circle cx="0" cy="-7" r="8" fill="#e2e8f0"/>
    <path d="M-14 10 Q-14 -3 0 -3 Q14 -3 14 10 V12 H-14 Z" fill="#e2e8f0"/>
  </g>
  <rect x="92" y="30" width="200" height="46" rx="12" fill="#334155"/>
  <text x="110" y="59" fill="#e2e8f0" font-size="13" font-family="Segoe UI, sans-serif">What's my task status?</text>

  <!-- Bot 1 (reply) -->
  <circle cx="360" cy="105" r="24" fill="rgba(56,189,248,0.25)" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow-bot)"/>
  <g transform="translate(360,105) scale(0.5)">
    <rect x="-14" y="-14" width="28" height="24" rx="6" fill="none" stroke="#e2e8f0" stroke-width="2.5"/>
    <circle cx="-5" cy="-3" r="2.5" fill="#e2e8f0"/>
    <circle cx="5" cy="-3" r="2.5" fill="#e2e8f0"/>
    <path d="M-5 6 Q0 10 5 6" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="-14" x2="0" y2="-20" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="0" cy="-22" r="2.5" fill="#38bdf8"/>
  </g>
  <rect x="110" y="127" width="230" height="60" rx="14" fill="rgba(56,189,248,0.12)" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="128" y="155" fill="#f1f5f9" font-size="13" font-family="Segoe UI, sans-serif">You have 3 active tasks:</text>
  <text x="128" y="175" fill="#94a3b8" font-size="11" font-family="Segoe UI, sans-serif">#42 Bug fix, #15 Review, Notes</text>

  <!-- User 2 -->
  <circle cx="60" cy="225" r="20" fill="#475569"/>
  <g transform="translate(60,225) scale(0.45)">
    <circle cx="0" cy="-7" r="8" fill="#e2e8f0"/>
    <path d="M-14 10 Q-14 -3 0 -3 Q14 -3 14 10 V12 H-14 Z" fill="#e2e8f0"/>
  </g>
  <rect x="92" y="200" width="160" height="46" rx="12" fill="#334155"/>
  <text x="110" y="229" fill="#e2e8f0" font-size="13" font-family="Segoe UI, sans-serif">Prioritize #42</text>

  <!-- Bot 2 (reply) -->
  <circle cx="360" cy="295" r="24" fill="rgba(56,189,248,0.25)" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow-bot)"/>
  <g transform="translate(360,295) scale(0.5)">
    <rect x="-14" y="-14" width="28" height="24" rx="6" fill="none" stroke="#e2e8f0" stroke-width="2.5"/>
    <circle cx="-5" cy="-3" r="2.5" fill="#e2e8f0"/>
    <circle cx="5" cy="-3" r="2.5" fill="#e2e8f0"/>
    <path d="M-5 6 Q0 10 5 6" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="-14" x2="0" y2="-20" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="0" cy="-22" r="2.5" fill="#38bdf8"/>
  </g>
  <rect x="110" y="317" width="220" height="46" rx="14" fill="rgba(56,189,248,0.12)" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="128" y="346" fill="#f1f5f9" font-size="13" font-family="Segoe UI, sans-serif">Done. Priority: High 🔥</text>


  <!-- ===================== DOUBLE-ARROW (Center ↔ Right) ===================== -->
  <line x1="420" y1="200" x2="490" y2="200" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-blue)" opacity="0.7"/>
  <line x1="490" y1="210" x2="420" y2="210" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-blue)" opacity="0.7"/>


  <!-- ===================== RIGHT PANEL: LLM + Task (vertical) ===================== -->
  <!-- Panel frame -->
  <rect x="510" y="50" width="270" height="300" rx="14" fill="rgba(56,189,248,0.06)" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.9"/>
  <text x="645" y="78" text-anchor="middle" fill="#f1f5f9" font-size="13" font-family="Segoe UI, sans-serif" font-weight="600" letter-spacing="0.04em">BACKEND</text>

  <!-- LLM module (top) -->
  <rect x="550" y="105" width="190" height="80" rx="10" fill="rgba(167,139,250,0.12)" stroke="#a78bfa" stroke-width="1.5"/>
  <g transform="translate(645,145) scale(1.1)">
    <rect x="-10" y="-10" width="20" height="20" rx="4" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="-16" y1="0" x2="-10" y2="0" stroke="#a78bfa" stroke-width="2"/>
    <line x1="10" y1="0" x2="16" y2="0" stroke="#a78bfa" stroke-width="2"/>
    <line x1="0" y1="-16" x2="0" y2="-10" stroke="#a78bfa" stroke-width="2"/>
    <line x1="0" y1="10" x2="0" y2="16" stroke="#a78bfa" stroke-width="2"/>
  </g>
  <text x="645" y="200" text-anchor="middle" fill="#f1f5f9" font-size="12" font-family="Segoe UI, sans-serif" font-weight="600">LLM</text>

  <!-- vertical line LLM <-> Task inside panel -->
  <line x1="645" y1="215" x2="645" y2="235" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.5"/>

  <!-- Task JSON module (bottom) -->
  <rect x="550" y="250" width="190" height="80" rx="10" fill="rgba(52,211,153,0.12)" stroke="#34d399" stroke-width="1.5"/>
  <g transform="translate(645,290) scale(1.1)">
    <rect x="-9" y="-11" width="18" height="22" rx="2" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="-5" y1="-5" x2="5" y2="-5" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="-5" y1="0" x2="5" y2="0" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="-5" y1="5" x2="3" y2="5" stroke="#e2e8f0" stroke-width="1.5"/>
  </g>
  <text x="645" y="345" text-anchor="middle" fill="#f1f5f9" font-size="12" font-family="Segoe UI, sans-serif" font-weight="600">Task JSON</text>

</svg>