<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-hitbox" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="400" fill="none"/>

  <!-- ===================== PLANE GRID (XY) ===================== -->
  <!-- Horizontal grid lines -->
  <g opacity="0.2">
    <line x1="80" y1="280" x2="720" y2="280" stroke="#38bdf8" stroke-width="1"/>
    <line x1="80" y1="300" x2="720" y2="300" stroke="#38bdf8" stroke-width="1"/>
    <line x1="80" y1="320" x2="720" y2="320" stroke="#38bdf8" stroke-width="1"/>
    <line x1="80" y1="340" x2="720" y2="340" stroke="#38bdf8" stroke-width="1"/>
  </g>
  <!-- Vertical grid lines -->
  <g opacity="0.2">
    <line x1="150" y1="250" x2="150" y2="380" stroke="#38bdf8" stroke-width="1"/>
    <line x1="350" y1="250" x2="350" y2="380" stroke="#38bdf8" stroke-width="1"/>
    <line x1="550" y1="250" x2="550" y2="380" stroke="#38bdf8" stroke-width="1"/>
  </g>


  <!-- ===== LEFT: Cube Projection on XY Plane ===== -->
  <!-- Hitbox (red dashed square) -->
  <rect x="200" y="130" width="160" height="160" rx="3" fill="none" stroke="#f87171" stroke-width="2"
        stroke-dasharray="8,5" filter="url(#glow-hitbox)"/>

  <!-- Cube XY projection (square) -->
  <rect x="230" y="160" width="100" height="100" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.95"/>
  <!-- Cube label -->
  <text x="280" y="310" text-anchor="middle" fill="#94a3b8" font-size="13" font-family="Segoe UI, sans-serif" font-weight="500">Cube</text>


  <!-- ===== RIGHT: Tetrahedron Projection on XY Plane ===== -->
  <!-- Hitbox (red dashed circle) -->
  <circle cx="580" cy="210" r="85" fill="none" stroke="#f87171" stroke-width="2"
          stroke-dasharray="8,5" filter="url(#glow-hitbox)"/>

  <!-- Tetrahedron XY projection (triangle) -->
  <polygon points="520,270 640,270 580,150" fill="none" stroke="#34d399" stroke-width="3" opacity="0.95"/>
  <!-- Tetrahedron centroid dot -->
  <circle cx="580" cy="230" r="3" fill="#34d399" opacity="0.7"/>
  <!-- Tetrahedron label -->
  <text x="580" y="340" text-anchor="middle" fill="#94a3b8" font-size="13" font-family="Segoe UI, sans-serif" font-weight="500">Tetrahedron</text>


  <!-- ===== LEFT BOTTOM: Isometric XYZ Axes ===== -->
  <g transform="translate(90, 350)">
    <!-- Origin -->
    <circle cx="0" cy="0" r="4" fill="#f1f5f9"/>

    <!-- X axis (down-right) -->
    <line x1="0" y1="0" x2="32" y2="18" stroke="#f87171" stroke-width="3" stroke-linecap="round"/>
    <text x="40" y="28" fill="#f87171" font-size="14" font-family="Segoe UI, sans-serif" font-weight="700">X</text>

    <!-- Y axis (up-right) -->
    <line x1="0" y1="0" x2="32" y2="-18" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
    <text x="40" y="-20" fill="#34d399" font-size="14" font-family="Segoe UI, sans-serif" font-weight="700">Y</text>

    <!-- Z axis (up) -->
    <line x1="0" y1="0" x2="0" y2="-38" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <text x="-5" y="-48" fill="#38bdf8" font-size="14" font-family="Segoe UI, sans-serif" font-weight="700">Z</text>
  </g>


  <!-- ===== TOP LABEL ===== -->
  <text x="400" y="50" text-anchor="middle" fill="#f1f5f9" font-size="14" font-family="Segoe UI, sans-serif" font-weight="600" letter-spacing="0.04em">PROJECTION ONTO XY PLANE</text>

</svg>