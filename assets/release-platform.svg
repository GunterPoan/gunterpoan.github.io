<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ==================== TOP: Two boxes + arrows ==================== -->

  <g filter="url(#shadow)">
    <rect x="260" y="6" width="220" height="60" rx="16" fill="#0ea5e9"/>
    <text x="370" y="40" text-anchor="middle" font-family="Inter, -apple-system, sans-serif"
          font-size="20" font-weight="600" fill="#f1f5f9">Vite + Typescript</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="520" y="6" width="180" height="60" rx="16" fill="#0ea5e9"/>
    <text x="610" y="40" text-anchor="middle" font-family="Inter, -apple-system, sans-serif"
          font-size="20" font-weight="600" fill="#f1f5f9">Flask API</text>
  </g>

  <!-- Arrow: left -> right -->
  <line x1="490" y1="24" x2="510" y2="24" stroke="#38bdf8" stroke-width="2.5"/>
  <polygon points="510,21 517,24 510,27" fill="#38bdf8"/>

  <!-- Arrow: right -> left -->
  <line x1="510" y1="48" x2="490" y2="48" stroke="#38bdf8" stroke-width="2.5"/>
  <polygon points="490,45 483,48 490,51" fill="#38bdf8"/>

  <!-- ==================== BOTTOM: 5 Feature Modules ==================== -->

  <!-- Module 1: Dashboard -->
  <g transform="translate(100, 110)">
    <circle cx="60" cy="40" r="38" fill="rgba(56,189,248,0.08)" stroke="rgba(56,189,248,0.25)" stroke-width="1.5"/>
    <rect x="40" y="22" width="40" height="30" rx="4" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <polyline points="44,43 49,36 54,40 61,30 68,34" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="53" y="52" width="14" height="3" rx="1.5" fill="#38bdf8" opacity="0.4"/>
    <text x="60" y="100" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">Dashboard</text>
  </g>

  <!-- Module 2: Trigger Build -->
  <g transform="translate(260, 110)">
    <circle cx="60" cy="40" r="38" fill="rgba(251,146,60,0.08)" stroke="rgba(251,146,60,0.25)" stroke-width="1.5"/>
    <path d="M51,28 C51,24 55,21 60,21 C65,21 69,24 69,28 L69,41" fill="none" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M51,37 L51,50 C51,54 55,58 60,58 L65,58" fill="none" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M69,37 L69,50" fill="none" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="76" cy="33" r="7.5" fill="none" stroke="#fb923c" stroke-width="2" opacity="0.4"/>
    <circle cx="76" cy="33" r="13" fill="none" stroke="#fb923c" stroke-width="1.5" opacity="0.25"/>
    <text x="60" y="100" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">Trigger Build</text>
  </g>

  <!-- Module 3: Schedule Build -->
  <g transform="translate(420, 110)">
    <circle cx="60" cy="40" r="38" fill="rgba(167,139,250,0.08)" stroke="rgba(167,139,250,0.25)" stroke-width="1.5"/>
    <rect x="38" y="22" width="44" height="34" rx="5" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
    <line x1="38" y1="34" x2="82" y2="34" stroke="#a78bfa" stroke-width="2.5"/>
    <rect x="46" y="16" width="4.5" height="8" rx="2" fill="#a78bfa"/>
    <rect x="69" y="16" width="4.5" height="8" rx="2" fill="#a78bfa"/>
    <circle cx="51" cy="43" r="2.2" fill="#a78bfa" opacity="0.5"/>
    <circle cx="60" cy="43" r="2.2" fill="#a78bfa" opacity="0.5"/>
    <circle cx="69" cy="43" r="2.2" fill="#a78bfa" opacity="0.5"/>
    <circle cx="51" cy="52" r="2.2" fill="#a78bfa" opacity="0.5"/>
    <circle cx="60" cy="52" r="2.2" fill="#a78bfa" opacity="0.5"/>
    <text x="60" y="100" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">Schedule Build</text>
  </g>

  <!-- Module 4: Authorization -->
  <g transform="translate(580, 110)">
    <circle cx="60" cy="40" r="38" fill="rgba(248,113,113,0.08)" stroke="rgba(248,113,113,0.25)" stroke-width="1.5"/>
    <circle cx="60" cy="28" r="8" fill="none" stroke="#f87171" stroke-width="2.5"/>
    <path d="M44,54 C44,44 52,40 60,40 C68,40 76,44 76,54" fill="none" stroke="#f87171" stroke-width="2.5"/>
    <rect x="52" y="50" width="16" height="11" rx="2" fill="none" stroke="#f87171" stroke-width="2" opacity="0.5"/>
    <circle cx="60" cy="55" r="2" fill="#f87171" opacity="0.6"/>
    <text x="60" y="100" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">Authorization</text>
  </g>

  <!-- Module 5: Change Log -->
  <g transform="translate(740, 110)">
    <circle cx="60" cy="40" r="38" fill="rgba(52,211,153,0.08)" stroke="rgba(52,211,153,0.25)" stroke-width="1.5"/>
    <rect x="40" y="22" width="33" height="40" rx="4" fill="none" stroke="#34d399" stroke-width="2.5"/>
    <line x1="46" y1="33" x2="67" y2="33" stroke="#34d399" stroke-width="2" opacity="0.5"/>
    <line x1="46" y1="41" x2="61" y2="41" stroke="#34d399" stroke-width="2" opacity="0.5"/>
    <line x1="46" y1="49" x2="55" y2="49" stroke="#34d399" stroke-width="2" opacity="0.5"/>
    <path d="M64,16 L73,26 L67,32 L58,24 Z" fill="#34d399"/>
    <line x1="67" y1="32" x2="62" y2="27" stroke="#0f172a" stroke-width="1.5"/>
    <text x="60" y="100" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">Change Log</text>
  </g>

</svg>
